name: Unit tests

on:
  push:
    branches:
      - development
      - fix-action-on-pullrequest
  pull_request:
    branches:
      - development
      - fix-action-on-pullrequest
# 658654bb6239
jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: navir/opensuseleap-for-flexiblesusy
      options: --name builder -u root
    steps:
      - name: Copy Wolfram Engine license to the image
        run: |
          mkdir $HOME/.WolframEngine
          mkdir $HOME/.WolframEngine/Licensing
          echo $MATHPASS > $HOME/.WolframEngine/Licensing/mathpass
          mkdir /root/.WolframEngine
          mkdir /root/.WolframEngine/Licensing
          echo $MATHPASS > /root/.WolframEngine/Licensing/mathpass
          echo $MATHPASS > /usr/local/Wolfram/WolframEngine/12.0/Configuration/Licensing/mathpass
          cat /etc/hostname
        env:
          MATHPASS: ${{ secrets.MATHPASS }}
      - name: Test3
        run: |
          /usr/local/Wolfram/WolframEngine/12.0/Executables/math
        env:
          ID: ${{ secrets.ID }}
          PASS: ${{ secrets.PASS }}

