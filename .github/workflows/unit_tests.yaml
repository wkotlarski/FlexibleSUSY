name: Unit tests

on:
  push:
    branches:
      - development
      - fix-action-on-pullrequest

# 658654bb6239
jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: navir/opensuseleap-for-flexiblesusy
      options: --user root -h 658654bb6239
    steps:
      - name: Copy Wolfram Engine license to the image
        run: |
          echo $USER
          mkdir $HOME/.cache
          mkdir $HOME/.cache/Wolfram
          mkdir $HOME/.cache/Wolfram/WolframScript
          echo $MATHPASS > $HOME/.cache/Wolfram/WolframScript/mathpass
          mkdir $HOME/.WolframEngine
          mkdir $HOME/.WolframEngine/Licensing
          echo $MATHPASS > $HOME/.WolframEngine/Licensing/mathpass
          mkdir /root/.cache
          mkdir /root/.cache/Wolfram
          mkdir /root/.cache/Wolfram/WolframScript
          echo $MATHPASS > /root/.cache/Wolfram/WolframScript/mathpass
          echo $MATHPASS > /usr/local/Wolfram/WolframEngine/12.0/Configuration/Licensing/mathpass
          /usr/local/Wolfram/WolframEngine/12.0/Executables/math
        env:
          MATHPASS: ${{ secrets.MATHPASS }}

